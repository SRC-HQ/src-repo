# =============================================================================
# Sperm Race - Production (API + Web + Redis)
# Usage: docker compose up -d
# Build: docker compose build
# Env: set via .env or pass at runtime (never commit secrets)
# =============================================================================

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-spermrace_redis_secret}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    # No ports exposed — Redis is internal-only (not accessible from host/internet)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-spermrace_redis_secret}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sperm-race-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: "0.0.0.0"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-spermrace_redis_secret}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - default
      - dokploy-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL}
        NEXT_PUBLIC_PROGRAM_ID: ${NEXT_PUBLIC_PROGRAM_ID}
    image: sperm-race-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - dokploy-network

volumes:
  redis-data:

networks:
  dokploy-network:
    external: true